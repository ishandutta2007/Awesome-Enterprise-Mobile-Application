<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Subtle CSS Animations */
    @keyframes floatParticle1 {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(30px, -20px); opacity: 0.7; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(-25px, 25px); opacity: 0.6; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 7s ease-in-out infinite; }
    .flow-path { stroke-dasharray: 8 6; animation: flowLine 20s linear infinite; }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Background Orbs (Non-obstructive) -->
  <g opacity="0.3">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="600" cy="380" r="100" fill="#3b82f6" filter="url(#softGlow)" opacity="0.2" />
  </g>

  <!-- Geometric Grid Accent (Low opacity in background) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Animated Dynamic Data Flow Line (Background element) -->
  <path class="flow-path" d="M -50 320 Q 300 240, 600 340 T 1250 260" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.4" />
  <path class="flow-path" d="M -50 120 Q 400 60, 800 160 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />

  <!-- Floating Particles in Background -->
  <g class="particle-1">
    <circle cx="150" cy="240" r="3" fill="#38bdf8" />
    <circle cx="480" cy="80" r="2.5" fill="#a855f7" />
    <circle cx="880" cy="130" r="3.5" fill="#c084fc" />
  </g>
  <g class="particle-2">
    <circle cx="280" cy="330" r="2" fill="#818cf8" />
    <circle cx="750" cy="310" r="3" fill="#38bdf8" />
    <circle cx="1050" cy="90" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Decorative Enterprise Mobile Device Silhouette (Right Corner Background) -->
  <g transform="translate(1010, 65) rotate(10)" opacity="0.18">
    <rect x="0" y="0" width="130" height="250" rx="20" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="65" cy="18" r="4" fill="#ffffff" />
    <line x1="40" y1="235" x2="90" y2="235" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Content: Top Badge / Category Pill -->
  <g transform="translate(70, 52)">
    <rect width="250" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="code-text">ENTERPRISE MOBILITY &amp; UEM</text>
  </g>

  <!-- Foreground Main Title -->
  <g transform="translate(70, 140)">
    <text class="title">
      Awesome <tspan fill="url(#primaryGlow)">Enterprise Mobile</tspan> Application
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(70, 185)">
    <text class="subtitle">
      Curated Ecosystem of Enterprise Mobility Management (EMM), UEM &amp; Mobile Development
    </text>
  </g>

  <!-- Feature / Topic Badges in Foreground -->
  <g transform="translate(70, 240)">
    <!-- Badge 1: UEM & MDM -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="20" y="26" class="pill-text">📱 Unified Endpoint (UEM)</text>
    </g>

    <!-- Badge 2: Mobile Security -->
    <g transform="translate(195, 0)">
      <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="20" y="26" class="pill-text">🛡️ Device &amp; App Security</text>
    </g>

    <!-- Badge 3: Low-Code & BaaS -->
    <g transform="translate(405, 0)">
      <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="20" y="26" class="pill-text">⚡ Mobile BaaS &amp; Low-Code</text>
    </g>

    <!-- Badge 4: Open Source -->
    <g transform="translate(610, 0)">
      <rect width="170" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
      <text x="20" y="26" class="pill-text">🌐 100% Open Source</text>
    </g>
  </g>

  <!-- Bottom Metric / Tagline bar -->
  <g transform="translate(70, 335)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      SaaS Category Leaders &#8226; Open-Source Alternatives &#8226; Real-time Market Intelligence &#8226; Star Metrics
    </text>
  </g>
</svg>